[[entry]]
id = 12
type = "story"
title = "Uji end-to-end di Production dan rilis template v1"
description = "Menjalankan Done when 1–6 di Production (laptop dan upload di PC kantor dengan macro diblokir, termasuk file lama, Save As .xlsx, sudah dinilai lewat status SQL, dan dibatalkan), lalu menandai template v1 rilis."
verify = "Setiap Done when epic tercatat lulus dengan bukti log Production, dan v1 tercatat rilis di registry dan Notes."
